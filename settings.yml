name: Viessmann heat pump
strategy: polling
refresh_interval: 60
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: language
    name: Display language
    field_type: select
    options:
      - English: en
      - Deutsch: de
    default: en
    optional: true
  - keyname: time_zone
    name: Display time zone
    field_type: time_zone
    default: Europe/Berlin
    optional: true
  - keyname: installation_id
    name: API installation ID
    field_type: string
  - keyname: gateway_serial
    name: API gateway serial number
    field_type: string
  - keyname: device_id
    name: API device ID (verify against the device list)
    field_type: string
    default: "0"
  - keyname: circuit
    name: Heating circuit (0 = first circuit)
    field_type: string
    default: "0"
    optional: true
  - keyname: supply_feature
    name: "API feature: supply temperature"
    field_type: string
    default: heating.secondaryCircuit.sensors.temperature.supply
    optional: true
  - keyname: water_feature
    name: "API feature: hot-water cylinder temperature"
    field_type: string
    default: heating.dhw.sensors.temperature.dhwCylinder
    optional: true
  - keyname: outside_feature
    name: "API feature: outdoor temperature"
    field_type: string
    default: heating.sensors.temperature.outside
    optional: true
  - keyname: stale_minutes
    name: Mark readings stale after (minutes)
    field_type: string
    default: "120"
    optional: true
  - keyname: supply_setpoint_feature
    name: "API feature: supply setpoint (optional)"
    field_type: string
    optional: true
    description: Use the feature containing the actual supply target. Leave blank if
      unavailable; no target is invented.
  - keyname: water_setpoint_feature
    name: "API feature: configured hot-water target"
    field_type: string
    default: heating.dhw.temperature.main
    optional: true
  - keyname: curve_points
    name: Heating curve reference points (optional JSON)
    field_type: text
    optional: true
    description: Optional reference pairs to override the calculated E3 curve. Leave
      blank for dynamic calculation from API slope, offset, room target and
      limits.
  - keyname: max_supply_temperature
    name: Maximum supply temperature (fallback, °C)
    field_type: number
    optional: true
    min: 0
    max: 100
    description: Only used when the API omits the circuit maximum. Enter the current
      device setting (e.g. 50); API values take precedence.
polling_url: https://api.viessmann-climatesolutions.com/iot/v2/features/installations/{{
  installation_id | url_encode }}/gateways/{{ gateway_serial | url_encode
  }}/devices/{{ device_id | url_encode }}/features/
polling_headers: "Authorization: Bearer {{ oauth_access_token }}"
polling_verb: GET
serverless_language: node
oauth_enabled: "true"
oauth_authorize_url: https://iam.viessmann-climatesolutions.com/idp/v3/authorize
oauth_token_url: https://iam.viessmann-climatesolutions.com/idp/v3/token
oauth_scopes: IoT User offline_access
oauth_pkce_enabled: "true"
oauth_token_request_auth_method: body
