name: Viessmann Wärmepumpe
strategy: static
refresh_interval: 60
static_data: '{"data":[]}'
no_screen_padding: no
dark_mode: no
custom_fields:
  - keyname: circuit
    name: Heizkreis (0 = erster Heizkreis)
    field_type: string
    default: "0"
    optional: true
  - keyname: supply_feature
    name: "API-Feature: Vorlauftemperatur"
    field_type: string
    default: heating.secondaryCircuit.sensors.temperature.supply
    optional: true
  - keyname: water_feature
    name: "API-Feature: Warmwasserspeicher"
    field_type: string
    default: heating.dhw.sensors.temperature.dhwCylinder
    optional: true
  - keyname: outside_feature
    name: "API-Feature: Außentemperatur"
    field_type: string
    default: heating.sensors.temperature.outside
    optional: true
  - keyname: stale_minutes
    name: Veraltet nach Minuten
    field_type: string
    default: "120"
    optional: true
