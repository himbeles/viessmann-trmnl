name: Inspect electricity API feature
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Capture full electricity-total feature
        run: uv run --script auxiliary/capture_api_feature.py
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: electricity-total
          path: api-inspection/electricity-total.json
          retention-days: 1
          if-no-files-found: error
