name: Diagnose TRMNL polling
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Reset health and verify a live poll without uploading the plugin
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix auxiliary ci
      - name: Inspect saved configuration without displaying credentials
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
        run: node auxiliary/diagnose.mjs
      - name: Verify live polling without uploading
        if: inputs.refresh
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
        run: python3 auxiliary/refresh.py
